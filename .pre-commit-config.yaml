default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/crate-ci/committed
    rev: v1.1.12
    hooks:
      - id: committed

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.2
    hooks:
      - id: typos
        args: [--force-exclude]
      - id: typos
        alias: typos-commit-msg
        name: typos (commit message)
        args: []
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: require-scope
        name: commit subject needs a scope, like chore(lib)
        language: pygrep
        entry: '\A[a-z]+\([a-z-]+\)!?: '
        args: [--negate, --multiline]
        stages: [commit-msg]
      - id: rustfmt-nightly
        name: rustfmt (nightly)
        language: system
        entry: cargo +nightly-2026-11-16 fmt --all -- --check
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
      - id: dprint
        name: dprint
        language: system
        entry: cargo bin dprint check
        types_or: [markdown, toml, json, yaml]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format
        language: system
        entry: uv run --only-dev ruff format --check
        types_or: [python, pyi]
        pass_filenames: false
        stages: [pre-commit]
      - id: clippy
        name: clippy per feature set (as CI)
        language: system
        entry: >-
          bash -c 'for f in "" anstyle ratatui ratatui,anstyle serde serde,anstyle serde,ratatui serde,ratatui,anstyle; do
          RUSTDOCFLAGS="-D warnings" cargo clippy --workspace --all-targets --features "$f" || exit 1; done'
        types_or: [rust, toml]
        pass_filenames: false
        stages: [manual]
      - id: rustdoc
        name: rustdoc (as CI)
        language: system
        entry: env "RUSTDOCFLAGS=-D warnings" cargo doc --workspace --no-deps
        types_or: [rust, toml]
        pass_filenames: false
        stages: [manual]
      - id: ruff-check
        name: ruff check (as CI, once CI runs it)
        language: system
        entry: uv run --only-dev ruff check
        types_or: [python, pyi]
        pass_filenames: false
        stages: [manual]
      - id: lib-tests
        name: lib tests
        language: system
        entry: env "RUSTFLAGS=-D warnings" cargo test --all-features
        types_or: [rust, toml, markdown]
        pass_filenames: false
        stages: [manual]
