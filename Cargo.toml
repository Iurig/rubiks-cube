[workspace]
members = ["crates/lib", "crates/twisty-puzzles-py", "crates/virtual-cube-timer", "tools/cargo-bin"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Iurig/rubiks-cube"

[workspace.metadata.bin]
cargo-binstall = { version = "1.26.1", locked = true }
dprint = { version = "0.64.3", locked = true }

[profile.dev]
opt-level = 1
