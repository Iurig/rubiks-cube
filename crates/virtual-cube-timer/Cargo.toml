[package]
name = "virtual-cube-timer"
version = "0.1.0"

categories = ["games", "simulation"]
description = "A simple, command line, interactive Rubik's Cube and timer"
edition.workspace = true
keywords = ["Rubik's", "timer", "virtual", "simulation"]
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
bimap = { version = "0.6.3", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["serde"] }
dirs = "7.0.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-core = { version = "0.1.2", features = ["anstyle"] }
rubiks-cube = { version = "^0.1.1", path = "../lib", features = ["ratatui", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.24.0"
termprofile = "0.2.5"
tui-big-text = "0.8.10"

[features]
debug = []

[lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
rc_mutex = "warn"
string_slice = "warn"
style = { level = "warn", priority = -1 }
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

[lints.rust]
unused_crate_dependencies = "warn"

[lints.cargo]
pedantic = "warn"
