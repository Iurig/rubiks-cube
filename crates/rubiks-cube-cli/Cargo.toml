[package]
name = "rubiks-cube-cli"
version = "0.1.0"

categories = ["command-line-utilities", "games"]
description = "A command line interface for scrambling and solving a rubiks cube using human methods"
edition.workspace = true
keywords = ["rubiks", "cube", "twisty-puzzle", "Roux", "CFOP"]
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-core = { version = "0.1.2", features = ["anstyle"] }
rubiks-cube = { path = "../rubiks-cube", features = ["ratatui"] }
termprofile = "0.2.5"

[features]
debug = []

[lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
dbg_macro = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
rc_mutex = "warn"
string_slice = "warn"
style = { level = "warn", priority = -1 }
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

[lints.rust]
unused_crate_dependencies = "warn"
