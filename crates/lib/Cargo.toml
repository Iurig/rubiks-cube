[package]
name = "rubiks-cube"
version = "0.1.1"

categories = ["games", "simulation"]
edition.workspace = true
keywords = ["CFOP", "Roux", "cube", "rubiks", "twisty-puzzle"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A twisty puzzle library that supports human solving methods"

[dependencies]
anstyle = { version = "1.0.14", optional = true }
dyn-clone = "1.0.20"
fastrand = "2.5.0"
itertools = "0.15.0"
log = "0.4.34"
papaya = "0.2.5"
ratatui = { version = "0.30.2", optional = true }
ratatui-core = { version = "0.1.2", features = ["anstyle"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_with = { version = "3.25.0", optional = true }
termprofile = { version = "0.2.5", features = ["convert"], optional = true }
thiserror = "2.0.21"

[features]
anstyle = ["dep:anstyle", "dep:termprofile"]
ratatui = ["dep:ratatui", "dep:ratatui-core", "anstyle"]
serde = ["dep:serde", "dep:serde_with"]
sketch = []

[[example]]
name = "sketch"
required-features = ["sketch"]

[dev-dependencies]
anyhow = "1.0.104"
divan = "0.1.21"
env_logger = { version = "0.11.11" }
ntest = "0.10.0"
statrs = "0.19.1"

[[bench]]
harness = false
name = "solves"

[lints]
workspace = true
