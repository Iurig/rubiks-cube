[package]
name = "rubiks-cube"
version = "0.1.0"

categories = ["games", "simulation"]
description = "A twisty puzzle library that supports human solving methods"
edition.workspace = true
keywords = ["CFOP", "Roux", "cube", "rubiks", "twisty-puzzle"]
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
anstyle = { version = "1.0.14", optional = true }
dyn-clone = "1.0.20"
fastrand = "2.5.0"
itertools = "0.15.0"
log = "0.4.34"
papaya = "0.2.5"
ratatui = { version = "0.30.2", optional = true }
ratatui-core = { version = "0.1.2", features = ["anstyle"], optional = true }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"], optional = true }
termprofile = { version = "0.2.5", features = ["convert"], optional = true }
thiserror = "2.0.21"

[features]
anstyle = ["dep:anstyle", "dep:termprofile"]
ratatui = ["dep:ratatui", "dep:ratatui-core", "anstyle"]
sketch = []

[[example]]
name = "sketch"
required-features = ["sketch"]

[dev-dependencies]
anyhow = "1.0.104"
divan = "0.1.21"
env_logger = { version = "0.11.11" }
statrs = "0.19.1"

[[bench]]
harness = false
name = "solves"

[lints.clippy]
allow_attributes_without_reason = "warn"
assertions_on_result_states = "warn"
cargo = { level = "warn", priority = -1 }
dbg_macro = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
multiple_crate_versions = "allow"
multiple_unsafe_ops_per_block = "warn"
nursery = { level = "warn", priority = -1 }
panic = "warn"
panic_in_result_fn = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
print_stdout = "warn"
rc_mutex = "warn"
string_slice = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unreachable = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unnameable_types = "warn"
