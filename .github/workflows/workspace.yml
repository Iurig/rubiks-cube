name: Workspace CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7.1.0
      - uses: astral-sh/setup-uv@v9.0.0
      - run: rustup toolchain install nightly-2026-11-16 --profile minimal --component rustfmt --no-self-update
      - uses: cargo-bins/cargo-binstall@main
      - uses: pre-commit/action@v3.0.1

  commits:
    name: committed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@v1.1.12
