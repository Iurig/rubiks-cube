name: Library CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

# Every command names the package with `-p`. Run across the whole workspace, Cargo would build the
# library with the features the timer asks for, and the feature sets below would all be the same.
jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly-2026-11-16 --profile minimal --component rustfmt --no-self-update
      - run: cargo +nightly-2026-11-16 fmt -p rubiks-cube -- --check
      # `ratatui` turns on `anstyle`, so this lints the code behind every feature but `sketch`.
      - run: cargo clippy -p rubiks-cube --all-targets --features anstyle -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features ratatui -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features ratatui,anstyle -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features serde -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features serde,anstyle -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features serde,ratatui -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features serde,ratatui,anstyle -- -D warnings
      - run: cargo clippy -p rubiks-cube --all-targets --features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p rubiks-cube --all-targets --features ratatui,anstyle
      - run: cargo test -p rubiks-cube --features ratatui,anstyle

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p rubiks-cube --no-deps --features ratatui,serde
