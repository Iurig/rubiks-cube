name: Python CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install nightly-2026-11-16 --profile minimal --component rustfmt --no-self-update
      - run: cargo +nightly-2026-11-16 fmt -p twisty-puzzles-py -- --check
      # Without `--no-deps`, clippy also lints the library, and its warnings would fail this job.
      - run: cargo clippy -p twisty-puzzles-py --all-targets --no-deps -- -D warnings

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: Swatinem/rust-cache@v2
      - run: uv python install
      - run: uv sync
      - run: uv run pytest

  docs:
    name: cargo doc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p twisty-puzzles-py --no-deps

  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv run --only-dev ruff check --output-format=github
